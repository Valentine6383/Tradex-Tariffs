name: K2 Monitor APK

on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Signing key
        env:
          KS_B64: ${{ secrets.K2_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.K2_KEY_PASS }}
        run: |
          # Если в секретах репо есть свой ключ — берём его (тогда обновления ставятся поверх).
          # Если нет — делаем одноразовый ключ на эту сборку.
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/k2.keystore"
            echo "K2_KEY_PASS=$KS_PASS" >> "$GITHUB_ENV"
          else
            PASS=$(openssl rand -hex 16)
            keytool -genkeypair -keystore "$RUNNER_TEMP/k2.keystore" -storepass "$PASS" -keypass "$PASS" \
              -alias k2 -keyalg RSA -keysize 2048 -validity 20000 -dname "CN=K2 Monitor"
            echo "K2_KEY_PASS=$PASS" >> "$GITHUB_ENV"
          fi
          echo "K2_KEYSTORE=$RUNNER_TEMP/k2.keystore" >> "$GITHUB_ENV"
      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace
      - run: cp android/app/build/outputs/apk/release/app-release.apk K2-Monitor.apk
      - uses: actions/upload-artifact@v4
        with:
          name: K2-Monitor
          path: K2-Monitor.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: k2-monitor
          name: K2 Монитор (Android)
          body: Скачай K2-Monitor.apk на планшет и установи.
          files: K2-Monitor.apk
          make_latest: true
          target_commitish: ${{ github.sha }}
